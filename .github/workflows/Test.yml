name: Test archive script

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser html2text requests

      - name: Run test script
        env:
          FEED_URL: ${{ vars.FEED_URL }}
        run: python test.py
